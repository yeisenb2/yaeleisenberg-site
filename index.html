<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yael Eisenberg</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%231c1d22'/><text x='32' y='43' text-anchor='middle' font-family='Georgia,serif' font-size='30' font-weight='600' fill='%23faf9f6'>YE</text></svg>">  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c1d22;
      --paper: #faf9f6;
      --accent: #5b6b8c;
      --line: rgba(28, 29, 34, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Work Sans', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      max-width: 560px;
      text-align: center;
    }
    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(32px, 6vw, 44px);
      font-weight: 600;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }
    .kicker {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 32px;
    }
    .lede {
      font-size: 17px;
      color: #4a4a52;
      margin: 0 0 36px;
    }
    .btn {
      display: inline-block;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
    }
    .btn:hover { background: var(--accent); }
    .contact {
      margin-top: 28px;
      font-size: 14px;
      color: #6a6a72;
    }
    .contact a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
    .shop-link {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: #8a8a92;
    }
    .shop-link a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  </style>
</head>
<body>

  <div class="card">
    <p class="kicker">Website under construction</p>
    <h1>Yael Eisenberg</h1>
    <p class="lede">This site is still being built. In the meantime, here's my resume.</p>
    <a href="Yael_Eisenberg_resume.pdf" class="btn">View my resume (PDF)</a>
    <p class="contact">Reach me at <a href="mailto:ye45@cornell.edu">ye45@cornell.edu</a></p>
    <p class="shop-link">Looking for the shop? Visit <a href="https://yaelyuniquecreations.yaeleisenberg.com">YaelYuniqueCreations</a></p>
  </div>

</body>
</html>
